site_name: Kael Platform
site_description: A Go library for building LLM agents — tool-calling loop, workflows, delegation, and approval-gated tools.
site_url: https://unitz007.github.io/open-kael/
repo_url: https://github.com/unitz007/open-kael
repo_name: unitz007/open-kael
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

plugins:
  - search

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Guide:
      - Building an Agent: guide/agents.md
      - Tools: guide/tools.md
      - Workflows & Triggers: guide/workflows.md
      - Delegation: guide/delegation.md
      - Messaging: guide/messaging.md
      - Identity: guide/identity.md
      - Approval-Gated Tools: guide/approval.md
      - Memory: guide/memory.md
  - Reference:
      - How a Message Flows: reference/message-flow.md
      - Troubleshooting: reference/troubleshooting.md
      - Known Limitations: reference/known-limitations.md
  - Architecture:
      - System Architecture: architecture/system.md
      - Data Flow: architecture/data-flow.md
      - Environment Variables: architecture/environment-variables.md
      - Known Issues: architecture/known-issues.md
      - Extension Points: architecture/extension-points.md
      - File Map: architecture/file-map.md
